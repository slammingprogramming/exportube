[project]
name = "tune-history"
version = "0.1.0"
description = "Turn YouTube watch history into an enriched, auditable music catalog CSV."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "slammingprogramming" }]
keywords = [
    "youtube", "youtube-music", "music", "musicbrainz", "google-takeout",
    "watch-history", "csv-export", "music-identification", "yt-dlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp>=2024.8.6",
    "musicbrainzngs>=0.7.1",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.30.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.9.0",
    "rapidfuzz>=3.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "tqdm>=4.66.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "freezegun>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/slammingprogramming/tune-history"
Repository = "https://github.com/slammingprogramming/tune-history"
Issues = "https://github.com/slammingprogramming/tune-history/issues"
Changelog = "https://github.com/slammingprogramming/tune-history/blob/main/CHANGELOG.md"

[project.scripts]
tune-history = "tune_history.cli:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
